<!DOCTYPE html>
<html>
<head>
<script>
let tunnelUrl = "https://next-node-ai.serveousercontent.com"; // رابط السيرفر الدائم
let status = 3; // 3 للفشل الكامل، 2 للخطأ، 1 للتحويل التلقائي، 0 لرسالة التنبيه
let isDebugPressed = false;

window.addEventListener('keydown', function(event) {
    if (event.key === '7') {
        isDebugPressed = true;
    }
});

setTimeout(function() {
    if (isDebugPressed) {
        document.write("<h1>Debug Menu</h1><p>تم فتح قائمة التصحيح بنجاح.</p><a href='" + tunnelUrl + "'>الذهاب للرابط يدوياً</a>");
        return;
    }

    switch (status) {
        case 3:
            // وضع الفشل الكامل (Complete Failure)
            localStorage.clear();
            sessionStorage.clear();
            if (window.stop) { window.stop(); }
            document.open();
            document.write(`
                <div style="background-color: #121212; color: #ff5555; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: Tahoma, sans-serif; text-align: center;">
                    <h1>⚠️ SYSTEM COMPLETE FAILURE</h1>
                    <p style="color: #ccc; margin-top: 10px;">تم إيقاف النظام بالكامل ومسح كافة الجلسات لأسباب أمنية طارئة.</p>
                </div>
            `);
            document.close();
            break;
        case 2:
            document.write("Error: Please enter the tunnel URL.");
            break;
        case 1:
            window.location.href = tunnelUrl;
            break;
        case 0:
            document.write("sorry the srvise is unavilbe and if you want to use the <a href='" + tunnelUrl + "'>servese</a> any way we are not resposble if you contenued any way");
            break;
    }
}, 2000);
</script>
</head>
<body>
</body>
</html>
